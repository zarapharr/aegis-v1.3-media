<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf8ef"/>
      <stop offset="100%" stop-color="#f7eedb"/>
    </linearGradient>
    <linearGradient id="navy-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c5f7f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2c5f7f" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1536" height="1024" fill="url(#bg)"/>

  <!-- Thin gold horizon line -->
  <line x1="120" y1="634" x2="1416" y2="634" stroke="#b8860b" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Tier number watermark -->
  <text x="1376" y="220" font-family="Georgia, serif" font-size="200" font-weight="300"
        fill="#2c5f7f" fill-opacity="0.08" text-anchor="end">1</text>

  <!-- Aegis mark (top-left) -->
  <g transform="translate(120,120)">
    <path d="M 0 0 L 60 0 L 60 70 Q 60 100 30 110 Q 0 100 0 70 Z"
          fill="none" stroke="#2c5f7f" stroke-width="3"/>
    <!-- 4 rung ladder inside -->
    <line x1="14" y1="22" x2="46" y2="22" stroke="#2c5f7f" stroke-width="2"/>
    <line x1="14" y1="42" x2="46" y2="42" stroke="#2c5f7f" stroke-width="2"/>
    <line x1="14" y1="62" x2="46" y2="62" stroke="#2c5f7f" stroke-width="2"/>
    <line x1="14" y1="82" x2="46" y2="82" stroke="#2c5f7f" stroke-width="2"/>
    <text x="90" y="55" font-family="Georgia, serif" font-size="34" font-weight="500" fill="#2c5f7f">AEGIS</text>
    <text x="90" y="95" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#1a2a35" opacity="0.7">ACADEMY</text>
  </g>

  <!-- Tier label -->
  <text x="120" y="563" font-family="Georgia, serif" font-size="32" letter-spacing="6" fill="#b8860b">TIER 1</text>

  <!-- Tier name -->
  <text x="120" y="675" font-family="Georgia, serif" font-size="84" font-weight="500" fill="#1e4660">Operating Discipline</text>

  <!-- Tagline -->
  <text x="120" y="757" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1a2a35" opacity="0.7">Where AI fits in your real work — with evals, kill criteria, and a daily ritual.</text>

  <!-- Right-side motif -->
  <g transform="translate(952,184)">

    <!-- Workbench: simple wood-tone rect -->
    <rect x="40" y="160" width="320" height="200" fill="#e8d9b5" stroke="#b8860b" stroke-width="2" rx="4"/>
    <!-- Magnifier (verification) -->
    <g transform="translate(90,200)">
      <circle cx="40" cy="40" r="38" fill="none" stroke="#2c5f7f" stroke-width="4"/>
      <line x1="68" y1="68" x2="100" y2="100" stroke="#2c5f7f" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Ruler/gauge (evals) -->
    <g transform="translate(170,240)">
      <rect width="120" height="20" fill="#9bc7d8" stroke="#2c5f7f" stroke-width="1.5"/>
      <line x1="10" y1="20" x2="10" y2="10" stroke="#2c5f7f"/>
      <line x1="30" y1="20" x2="30" y2="10" stroke="#2c5f7f"/>
      <line x1="50" y1="20" x2="50" y2="10" stroke="#2c5f7f"/>
      <line x1="70" y1="20" x2="70" y2="10" stroke="#2c5f7f"/>
      <line x1="90" y1="20" x2="90" y2="10" stroke="#2c5f7f"/>
      <line x1="110" y1="20" x2="110" y2="10" stroke="#2c5f7f"/>
    </g>
    <!-- Envelope (data policy) -->
    <g transform="translate(220,260)">
      <rect width="100" height="64" fill="#fdf8ef" stroke="#2c5f7f" stroke-width="2"/>
      <path d="M 0 0 L 50 36 L 100 0" fill="none" stroke="#2c5f7f" stroke-width="2"/>
      <circle cx="78" cy="48" r="6" fill="#b8860b"/>
    </g>

  </g>

  <!-- Footer line -->
  <text x="120" y="974" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1a2a35" opacity="0.5">aegisboardroom.com · v1.3</text>
</svg>