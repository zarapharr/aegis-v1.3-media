<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf8ef"/>
      <stop offset="100%" stop-color="#f7eedb"/>
    </linearGradient>
    <linearGradient id="navy-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c5f7f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2c5f7f" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1536" height="1024" fill="url(#bg)"/>

  <!-- Thin gold horizon line -->
  <line x1="120" y1="634" x2="1416" y2="634" stroke="#b8860b" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Tier number watermark -->
  <text x="1376" y="220" font-family="Georgia, serif" font-size="200" font-weight="300"
        fill="#2c5f7f" fill-opacity="0.08" text-anchor="end">3</text>

  <!-- Aegis mark (top-left) -->
  <g transform="translate(120,120)">
    <path d="M 0 0 L 60 0 L 60 70 Q 60 100 30 110 Q 0 100 0 70 Z"
          fill="none" stroke="#2c5f7f" stroke-width="3"/>
    <!-- 4 rung ladder inside -->
    <line x1="14" y1="22" x2="46" y2="22" stroke="#2c5f7f" stroke-width="2"/>
    <line x1="14" y1="42" x2="46" y2="42" stroke="#2c5f7f" stroke-width="2"/>
    <line x1="14" y1="62" x2="46" y2="62" stroke="#2c5f7f" stroke-width="2"/>
    <line x1="14" y1="82" x2="46" y2="82" stroke="#2c5f7f" stroke-width="2"/>
    <text x="90" y="55" font-family="Georgia, serif" font-size="34" font-weight="500" fill="#2c5f7f">AEGIS</text>
    <text x="90" y="95" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#1a2a35" opacity="0.7">ACADEMY</text>
  </g>

  <!-- Tier label -->
  <text x="120" y="563" font-family="Georgia, serif" font-size="32" letter-spacing="6" fill="#b8860b">TIER 3</text>

  <!-- Tier name -->
  <text x="120" y="675" font-family="Georgia, serif" font-size="84" font-weight="500" fill="#1e4660">Boardroom Decision Discipline</text>

  <!-- Tagline -->
  <text x="120" y="757" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1a2a35" opacity="0.7">Seven pathologies. Seven lenses. One review the board can defend.</text>

  <!-- Right-side motif -->
  <g transform="translate(952,184)">

    <!-- Oval table top-down -->
    <ellipse cx="200" cy="200" rx="180" ry="100" fill="#3a2a18" stroke="#2c5f7f" stroke-width="3"/>
    <ellipse cx="200" cy="200" rx="170" ry="92" fill="none" stroke="#b8860b" stroke-width="0.5" stroke-opacity="0.4"/>
    <!-- 7 coffee cup rings at lens positions -->
<circle cx="200" cy="125" r="14" fill="none" stroke="#fdf8ef" stroke-width="2.5"/>
    <circle cx="200" cy="125" r="9" fill="#fdf8ef" fill-opacity="0.15"/>
    <circle cx="313" cy="153" r="14" fill="none" stroke="#fdf8ef" stroke-width="2.5"/>
    <circle cx="313" cy="153" r="9" fill="#fdf8ef" fill-opacity="0.15"/>
    <circle cx="341" cy="217" r="14" fill="none" stroke="#fdf8ef" stroke-width="2.5"/>
    <circle cx="341" cy="217" r="9" fill="#fdf8ef" fill-opacity="0.15"/>
    <circle cx="263" cy="268" r="14" fill="none" stroke="#fdf8ef" stroke-width="2.5"/>
    <circle cx="263" cy="268" r="9" fill="#fdf8ef" fill-opacity="0.15"/>
    <circle cx="137" cy="268" r="14" fill="none" stroke="#fdf8ef" stroke-width="2.5"/>
    <circle cx="137" cy="268" r="9" fill="#fdf8ef" fill-opacity="0.15"/>
    <circle cx="59" cy="217" r="14" fill="none" stroke="#fdf8ef" stroke-width="2.5"/>
    <circle cx="59" cy="217" r="9" fill="#fdf8ef" fill-opacity="0.15"/>
    <circle cx="87" cy="153" r="14" fill="none" stroke="#fdf8ef" stroke-width="2.5"/>
    <circle cx="87" cy="153" r="9" fill="#fdf8ef" fill-opacity="0.15"/>
    <text x="200" y="206" font-family="Georgia,serif" font-size="14" text-anchor="middle" fill="#fdf8ef" opacity="0.7" letter-spacing="3">SEVEN LENSES</text>
  </g>

  <!-- Footer line -->
  <text x="120" y="974" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1a2a35" opacity="0.5">aegisboardroom.com · v1.3</text>
</svg>