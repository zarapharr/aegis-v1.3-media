<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1700" width="1440" height="1700">
  <rect width="1440" height="1700" fill="#fdf8ef"/>
  
  <!-- Browser chrome -->
  <rect width="1440" height="48" fill="#e0e0e0"/>
  <circle cx="20" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="24" r="6" fill="#febc2e"/>
  <circle cx="60" cy="24" r="6" fill="#28c840"/>
  <rect x="200" y="12" width="900" height="24" rx="12" fill="#ffffff" stroke="#cccccc"/>
  <text x="220" y="29" font-family="Helvetica" font-size="13" fill="#666">https://aegisboardroom.com/m/brief-writing?l=tok_abcd1234</text>
  <text x="1200" y="29" font-family="Helvetica" font-size="11" fill="#666">Manager view — what Sarah is working on</text>

  
  <!-- Site nav -->
  <rect y="48" width="1440" height="72" fill="#fdf8ef"/>
  <g transform="translate(80,68)">
    <path d="M 0 0 L 26 0 L 26 30 Q 26 43 13 47 Q 0 43 0 30 Z" fill="none" stroke="#2c5f7f" stroke-width="1.5"/>
    <line x1="6" y1="9" x2="20" y2="9" stroke="#2c5f7f" stroke-width="1"/>
    <line x1="6" y1="18" x2="20" y2="18" stroke="#2c5f7f" stroke-width="1"/>
    <line x1="6" y1="27" x2="20" y2="27" stroke="#2c5f7f" stroke-width="1"/>
    <line x1="6" y1="36" x2="20" y2="36" stroke="#2c5f7f" stroke-width="1"/>
    <text x="42" y="22" font-family="Georgia" font-size="20" font-weight="500" fill="#2c5f7f">AEGIS</text>
    <text x="42" y="40" font-family="Georgia" font-size="12" font-style="italic" fill="#1a2a35" opacity="0.6">ACADEMY</text>
  </g>
  <g font-family="Helvetica" font-size="14" fill="#1a2a35">
    <text x="900" y="92" fill="#2c5f7f">Academy</text>
    <text x="990" y="92">Sprints</text>
    <text x="1070" y="92">Credentials</text>
    <text x="1180" y="92">About</text>
  </g>
  <rect x="1260" y="75" width="110" height="34" rx="3" fill="#2c5f7f"/>
  <text x="1315" y="97" font-family="Helvetica" font-size="14" fill="#fdf8ef" text-anchor="middle">Apply</text>


  <!-- Manager context badge -->
  <g transform="translate(80,160)">
    <rect width="1280" height="80" fill="white" stroke="#b8860b" stroke-width="2"/>
    <rect width="6" height="80" fill="#b8860b"/>
    <text x="30" y="35" font-family="Georgia" font-size="13" letter-spacing="2" fill="#b8860b">MANAGER COMPANION VIEW</text>
    <text x="30" y="60" font-family="Helvetica" font-size="14" fill="#1a2a35">You are seeing this because <tspan font-weight="600">Sarah Chen</tspan> shared her Aegis Tier 2 progress with you.</text>
    <text x="1240" y="50" font-family="Helvetica" font-size="12" fill="#4a5a65" text-anchor="end">Privacy posture · Revoke link</text>
  </g>

  <!-- Tier + module -->
  <g transform="translate(80,280)">
    <text x="0" y="0" font-family="Georgia" font-size="14" letter-spacing="3" fill="#b8860b">TIER 2 · MODULE 2.2</text>
    <text x="0" y="50" font-family="Georgia" font-size="42" font-weight="500" fill="#1e4660">Brief writing</text>
    <text x="0" y="80" font-family="Helvetica" font-size="14" fill="#4a5a65">Sarah is composing the 12-element agent brief this week.</text>
  </g>

  <!-- What Sarah is doing -->
  <g transform="translate(80,420)">
    <text x="0" y="0" font-family="Georgia" font-size="22" font-weight="500" fill="#1e4660">What Sarah is doing this week</text>
    <line x1="0" y1="14" x2="60" y2="14" stroke="#b8860b" stroke-width="2"/>
    <g transform="translate(0,40)" font-family="Helvetica" font-size="15" fill="#1a2a35">
      <text x="0" y="0">Composing the 12-element brief for the customer-support triage agent she</text>
      <text x="0" y="22">selected in Module 2.1. The brief is the human-readable description of what</text>
      <text x="0" y="44">the agent does, what it does NOT do, how it is reviewed, and when it is</text>
      <text x="0" y="66">killed.</text>
      <text x="0" y="100" font-style="italic" fill="#4a5a65">The brief is the artifact you will eventually sign as sponsor.</text>
    </g>
  </g>

  <!-- 5-minute conversation prompt -->
  <g transform="translate(80,680)">
    <text x="0" y="0" font-family="Georgia" font-size="22" font-weight="500" fill="#1e4660">5-minute conversation prompt</text>
    <line x1="0" y1="14" x2="60" y2="14" stroke="#b8860b" stroke-width="2"/>
    <rect y="40" width="1280" height="120" fill="white" stroke="#9bc7d8" stroke-width="1"/>
    <text x="40" y="80" font-family="Georgia" font-size="20" fill="#1e4660" font-style="italic">"Walk me through Section 3 of your brief — what is the agent NOT</text>
    <text x="40" y="106" font-family="Georgia" font-size="20" fill="#1e4660" font-style="italic">doing? Why is each item in scope-out?"</text>
    <text x="40" y="142" font-family="Helvetica" font-size="13" fill="#4a5a65">If she can answer in concrete language, the brief is on track. If scope-out is generic, push her to specifics.</text>
  </g>

  <!-- Cosign affordance -->
  <g transform="translate(80,880)">
    <text x="0" y="0" font-family="Georgia" font-size="22" font-weight="500" fill="#1e4660">Cosign affordance</text>
    <line x1="0" y1="14" x2="60" y2="14" stroke="#b8860b" stroke-width="2"/>
    <rect y="40" width="1280" height="240" fill="white" stroke="#2c5f7f" stroke-width="2"/>
    <text x="40" y="80" font-family="Helvetica" font-size="14" font-weight="600" fill="#1e4660">Sarah has invited you to cosign this module's apply-at-work assignment.</text>
    <text x="40" y="108" font-family="Helvetica" font-size="13" fill="#4a5a65">Read her draft brief (linked below). Confirm: read in full + no unanswered questions about scope, gates,</text>
    <text x="40" y="128" font-family="Helvetica" font-size="13" fill="#4a5a65">kill criteria, or named ownership.</text>
    <rect x="40" y="160" width="320" height="42" rx="3" fill="#2c5f7f"/>
    <text x="200" y="187" font-family="Helvetica" font-size="14" fill="#fdf8ef" text-anchor="middle">Read Sarah's draft brief →</text>
    <rect x="380" y="160" width="240" height="42" rx="3" fill="#b8860b"/>
    <text x="500" y="187" font-family="Helvetica" font-size="14" fill="#1e4660" font-weight="600" text-anchor="middle">Cosign + send →</text>
    <text x="40" y="232" font-family="Helvetica" font-size="11" fill="#4a5a65" opacity="0.7">A weak cosign trains Sarah that the cosign is theater. Sign honestly or send back with specific edits.</text>
  </g>

  <!-- Why this matters -->
  <g transform="translate(80,1200)">
    <text x="0" y="0" font-family="Georgia" font-size="22" font-weight="500" fill="#1e4660">Why this matters at work</text>
    <line x1="0" y1="14" x2="60" y2="14" stroke="#b8860b" stroke-width="2"/>
    <g transform="translate(0,40)" font-family="Helvetica" font-size="15" fill="#1a2a35">
      <text x="0" y="0">The brief is what makes Sarah's eventual Tier 2 agent directable by someone other</text>
      <text x="0" y="22">than her. When she goes on vacation, the named backup needs to be able to pause,</text>
      <text x="0" y="44">escalate, or kill the agent without searching for context.</text>
      <text x="0" y="78" font-style="italic" fill="#4a5a65">Your 5-minute conversation now is the difference between a brief that compounds and one that rots.</text>
    </g>
  </g>

  <!-- What you do NOT see -->
  <g transform="translate(80,1420)">
    <rect width="1280" height="160" fill="#1e4660"/>
    <text x="30" y="40" font-family="Georgia" font-size="14" letter-spacing="2" fill="#d4e9f1">WHAT YOU DO NOT SEE</text>
    <g transform="translate(30,60)" font-family="Helvetica" font-size="13" fill="#d4e9f1" opacity="0.85">
      <text x="0" y="20">· Sarah's quiz scores or wrong answers</text>
      <text x="0" y="40">· Sarah's private notes</text>
      <text x="0" y="60">· Modules where she did not opt to share</text>
      <text x="0" y="80">· Time spent in the module or any usage analytics</text>
    </g>
    <text x="30" y="148" font-family="Helvetica" font-size="11" fill="#d4e9f1" opacity="0.6">Companion view is a relationship, not a dashboard. Learner controls what is shared. Revocable any time.</text>
  </g>

  <!-- Footer -->
  <g transform="translate(0,1620)">
    <text x="80" y="40" font-family="Helvetica" font-size="11" fill="#4a5a65" opacity="0.7">aegisboardroom.com · Aegis Academy v1.3 manager companion</text>
  </g>
</svg>