  <!-- Main column -->
  <g transform="translate(80,330)">
    <text x="0" y="0" font-family="Georgia" font-size="14" letter-spacing="3" fill="#b8860b">MODULE 2.6 · ATOM 2 OF 3 · ~4 MIN</text>
    <text x="0" y="60" font-family="Georgia" font-size="46" font-weight="500" fill="#1e4660">Scope each tool precisely</text>
    <text x="0" y="100" font-family="Georgia" font-size="22" fill="#2c5f7f" font-style="italic">read-only, write-narrow, gated-write</text>

    <g transform="translate(0,160)" font-family="Georgia" font-size="17" fill="#1a2a35">
      <text x="0" y="0" font-weight="500" font-size="19" fill="#1e4660">Three scope levels, in order of safety</text>
      <text x="0" y="40">When you give the agent a tool, scope it down to the smallest version</text>
      <text x="0" y="65">that does the job.</text>

      <text x="0" y="115" font-weight="500" font-size="18" fill="#1e4660">Read-only</text>
      <text x="0" y="145">Default. The agent can fetch, query, search, read. It cannot change</text>
      <text x="0" y="170">anything. Most agent tasks need only read-only for 80% of their work.</text>

      <text x="0" y="220" font-weight="500" font-size="18" fill="#1e4660">Write-narrow</text>
      <text x="0" y="250">The agent can write, but only to a specific field, table, channel, or kind</text>
      <text x="0" y="275">of action. "Can set ticket priority and assignee. Cannot edit ticket text.</text>
      <text x="0" y="300">Cannot close."</text>

      <text x="0" y="350" font-weight="500" font-size="18" fill="#1e4660">Gated-write</text>
      <text x="0" y="380">The agent can propose a write, but a human must approve before it</text>
      <text x="0" y="405">executes. Default for any action that is irreversible, customer-visible,</text>
      <text x="0" y="430">financial, or safety-relevant.</text>
    </g>

    <!-- Embedded diagram -->
    <g transform="translate(0,720)">
      <rect width="900" height="240" fill="#d4e9f1" stroke="#2c5f7f" stroke-width="1"/>
      <text x="450" y="125" font-family="Helvetica" font-size="14" fill="#2c5f7f" text-anchor="middle">[03-tier2-trust-boundary.png]</text>
      <text x="450" y="145" font-family="Helvetica" font-size="11" fill="#2c5f7f" text-anchor="middle" opacity="0.6">trust boundary diagram inline</text>
    </g>

    <!-- Quick check block -->
    <g transform="translate(0,1010)">
      <rect width="900" height="220" fill="white" stroke="#b8860b" stroke-width="2"/>
      <rect width="6" height="220" fill="#b8860b"/>
      <text x="30" y="35" font-family="Georgia" font-size="13" letter-spacing="2" fill="#b8860b">QUICK CHECK</text>
      <text x="30" y="68" font-family="Helvetica" font-size="15" fill="#1a2a35">Your refund-triage agent needs to issue refunds for cases under $100.</text>
      <text x="30" y="89" font-family="Helvetica" font-size="15" fill="#1a2a35">Which tool scope?</text>
      <g transform="translate(30,108)" font-family="Helvetica" font-size="13" fill="#4a5a65">
        <text x="0" y="20">(A) Full write to the refund system.</text>
        <text x="0" y="44">(B) Read-only on tickets; gated-write on refunds.</text>
        <text x="0" y="68">(C) Write-narrow on refunds capped at $100, with daily-eval review.</text>
      </g>
    </g>
  </g>

