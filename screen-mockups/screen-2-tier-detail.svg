<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 2200" width="1440" height="2200">
  <rect width="1440" height="2200" fill="#fdf8ef"/>
  
  <!-- Browser chrome -->
  <rect width="1440" height="48" fill="#e0e0e0"/>
  <circle cx="20" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="24" r="6" fill="#febc2e"/>
  <circle cx="60" cy="24" r="6" fill="#28c840"/>
  <rect x="200" y="12" width="900" height="24" rx="12" fill="#ffffff" stroke="#cccccc"/>
  <text x="220" y="29" font-family="Helvetica" font-size="13" fill="#666">https://aegisboardroom.com/academy/tier-2</text>
  <text x="1200" y="29" font-family="Helvetica" font-size="11" fill="#666">Aegis Tier 2 — Agentic Delegation</text>

  
  <!-- Site nav -->
  <rect y="48" width="1440" height="72" fill="#fdf8ef"/>
  <g transform="translate(80,68)">
    <path d="M 0 0 L 26 0 L 26 30 Q 26 43 13 47 Q 0 43 0 30 Z" fill="none" stroke="#2c5f7f" stroke-width="1.5"/>
    <line x1="6" y1="9" x2="20" y2="9" stroke="#2c5f7f" stroke-width="1"/>
    <line x1="6" y1="18" x2="20" y2="18" stroke="#2c5f7f" stroke-width="1"/>
    <line x1="6" y1="27" x2="20" y2="27" stroke="#2c5f7f" stroke-width="1"/>
    <line x1="6" y1="36" x2="20" y2="36" stroke="#2c5f7f" stroke-width="1"/>
    <text x="42" y="22" font-family="Georgia" font-size="20" font-weight="500" fill="#2c5f7f">AEGIS</text>
    <text x="42" y="40" font-family="Georgia" font-size="12" font-style="italic" fill="#1a2a35" opacity="0.6">ACADEMY</text>
  </g>
  <g font-family="Helvetica" font-size="14" fill="#1a2a35">
    <text x="900" y="92" fill="#2c5f7f">Academy</text>
    <text x="990" y="92">Sprints</text>
    <text x="1070" y="92">Credentials</text>
    <text x="1180" y="92">About</text>
  </g>
  <rect x="1260" y="75" width="110" height="34" rx="3" fill="#2c5f7f"/>
  <text x="1315" y="97" font-family="Helvetica" font-size="14" fill="#fdf8ef" text-anchor="middle">Apply</text>


  <!-- Breadcrumb -->
  <text x="80" y="160" font-family="Helvetica" font-size="13" fill="#4a5a65">Academy / <tspan fill="#2c5f7f">Tier 2</tspan></text>

  <!-- Hero -->
  <g transform="translate(0,200)">
    <text x="80" y="0" font-family="Georgia" font-size="18" letter-spacing="6" fill="#b8860b">TIER 2</text>
    <text x="80" y="70" font-family="Georgia" font-size="64" font-weight="500" fill="#1e4660">Agentic Delegation</text>
    <text x="80" y="120" font-family="Helvetica" font-size="22" fill="#4a5a65">Brief the agent. Sample the work. Draw the trust boundary.</text>
    <text x="80" y="170" font-family="Helvetica" font-size="14" fill="#4a5a65">8-10 hours · Audience: managers supervising agentic work · Credential: Aegis Practitioner</text>

    <g transform="translate(820,-20)">
      <rect width="540" height="320" fill="#d4e9f1" stroke="#2c5f7f" stroke-width="1"/>
      <text x="270" y="170" font-family="Helvetica" font-size="14" fill="#2c5f7f" text-anchor="middle">[tier-2-hero.png]</text>
      <text x="270" y="190" font-family="Helvetica" font-size="11" fill="#2c5f7f" text-anchor="middle" opacity="0.6">relay-baton handoff over trust boundary</text>
    </g>
  </g>

  <!-- Sample atom card -->
  <g transform="translate(80,600)">
    <text x="0" y="0" font-family="Georgia" font-size="28" font-weight="500" fill="#1e4660">Sample this tier</text>
    <line x1="0" y1="14" x2="80" y2="14" stroke="#b8860b" stroke-width="2"/>
    <rect y="40" width="1280" height="360" fill="white" stroke="#9bc7d8" stroke-width="1"/>
    <text x="40" y="80" font-family="Georgia" font-size="14" letter-spacing="3" fill="#b8860b">LESSON 2.6, ATOM 2</text>
    <text x="40" y="115" font-family="Georgia" font-size="24" font-weight="500" fill="#1e4660">Scope each tool precisely: read-only, write-narrow, gated-write</text>
    <text x="40" y="155" font-family="Helvetica" font-size="14" fill="#4a5a65">When you give the agent a tool, scope it down to the smallest version that does the job.</text>
    <text x="40" y="180" font-family="Helvetica" font-size="14" fill="#4a5a65">Three scope levels, in order of safety.</text>
    <g transform="translate(40,210)">
      <rect width="380" height="100" fill="#d4e9f1" stroke="#2c5f7f" stroke-width="1"/>
      <text x="20" y="30" font-family="Helvetica" font-size="13" font-weight="600" fill="#1e4660">Read-only</text>
      <text x="20" y="55" font-family="Helvetica" font-size="11" fill="#4a5a65">Default. Agent can fetch, query, search.</text>
      <text x="20" y="75" font-family="Helvetica" font-size="11" fill="#4a5a65">80% of agent tasks need only this.</text>
    </g>
    <g transform="translate(440,210)">
      <rect width="380" height="100" fill="#d4e9f1" stroke="#2c5f7f" stroke-width="1"/>
      <text x="20" y="30" font-family="Helvetica" font-size="13" font-weight="600" fill="#1e4660">Write-narrow</text>
      <text x="20" y="55" font-family="Helvetica" font-size="11" fill="#4a5a65">Specific field, table, channel, or action.</text>
      <text x="20" y="75" font-family="Helvetica" font-size="11" fill="#4a5a65">"Can set priority. Cannot edit text."</text>
    </g>
    <g transform="translate(840,210)">
      <rect width="400" height="100" fill="#d4e9f1" stroke="#2c5f7f" stroke-width="1"/>
      <text x="20" y="30" font-family="Helvetica" font-size="13" font-weight="600" fill="#1e4660">Gated-write</text>
      <text x="20" y="55" font-family="Helvetica" font-size="11" fill="#4a5a65">Agent proposes; human approves.</text>
      <text x="20" y="75" font-family="Helvetica" font-size="11" fill="#4a5a65">Default for irreversible / customer-visible.</text>
    </g>
    <rect x="40" y="330" width="220" height="42" rx="3" fill="#2c5f7f"/>
    <text x="150" y="357" font-family="Helvetica" font-size="14" fill="#fdf8ef" text-anchor="middle">Read full atom →</text>
  </g>

  <!-- Modules grid -->
