    <text x="20" y="30" font-family="Georgia" font-size="14" letter-spacing="2" fill="#b8860b">MODULE 2.1</text>
    <text x="20" y="60" font-family="Georgia" font-size="20" font-weight="500" fill="#1e4660">The delegation loop</text>
    <text x="20" y="85" font-family="Helvetica" font-size="12" fill="#4a5a65">3 axes × 4 workers; pick the candidate workflow</text>
  </g>
  <g transform="translate(510,1140)">
    <rect width="410" height="110" fill="white" stroke="#9bc7d8" stroke-width="1"/>
    <text x="20" y="30" font-family="Georgia" font-size="14" letter-spacing="2" fill="#b8860b">MODULE 2.2</text>
    <text x="20" y="60" font-family="Georgia" font-size="20" font-weight="500" fill="#1e4660">Brief writing</text>
    <text x="20" y="85" font-family="Helvetica" font-size="12" fill="#4a5a65">Compose the 12-element agent brief</text>
  </g>
  <g transform="translate(940,1140)">
    <rect width="410" height="110" fill="white" stroke="#9bc7d8" stroke-width="1"/>
    <text x="20" y="30" font-family="Georgia" font-size="14" letter-spacing="2" fill="#b8860b">MODULE 2.3</text>
    <text x="20" y="60" font-family="Georgia" font-size="20" font-weight="500" fill="#1e4660">Review cadence</text>
    <text x="20" y="85" font-family="Helvetica" font-size="12" fill="#4a5a65">Sample-not-everything; 3-field rubric</text>
  </g>
  <g transform="translate(80,1270)">
    <rect width="410" height="110" fill="white" stroke="#9bc7d8" stroke-width="1"/>
    <text x="20" y="30" font-family="Georgia" font-size="14" letter-spacing="2" fill="#b8860b">MODULE 2.4</text>
    <text x="20" y="60" font-family="Georgia" font-size="20" font-weight="500" fill="#1e4660">When to overrule</text>
    <text x="20" y="85" font-family="Helvetica" font-size="12" fill="#4a5a65">3-row decision frame; override log</text>
  </g>
  <g transform="translate(510,1270)">
    <rect width="410" height="110" fill="white" stroke="#9bc7d8" stroke-width="1"/>
    <text x="20" y="30" font-family="Georgia" font-size="14" letter-spacing="2" fill="#b8860b">MODULE 2.5</text>
    <text x="20" y="60" font-family="Georgia" font-size="20" font-weight="500" fill="#1e4660">Agent ops cadence</text>
    <text x="20" y="85" font-family="Helvetica" font-size="12" fill="#4a5a65">5 rituals; incident protocol</text>
  </g>
  <g transform="translate(940,1270)">
    <rect width="410" height="110" fill="white" stroke="#9bc7d8" stroke-width="1"/>
    <text x="20" y="30" font-family="Georgia" font-size="14" letter-spacing="2" fill="#b8860b">MODULE 2.6</text>
    <text x="20" y="60" font-family="Georgia" font-size="20" font-weight="500" fill="#1e4660">Tools, MCP, trust boundary</text>
    <text x="20" y="85" font-family="Helvetica" font-size="12" fill="#4a5a65">Tool scope ladder; trust line</text>
  </g>
  <g transform="translate(80,1400)">
    <rect width="410" height="110" fill="white" stroke="#9bc7d8" stroke-width="1"/>
    <text x="20" y="30" font-family="Georgia" font-size="14" letter-spacing="2" fill="#b8860b">MODULE 2.7</text>
    <text x="20" y="60" font-family="Georgia" font-size="20" font-weight="500" fill="#1e4660">Multi-step workflow design</text>
    <text x="20" y="85" font-family="Helvetica" font-size="12" fill="#4a5a65">3 shapes; checkpoint placement</text>
  </g>
  <g transform="translate(510,1400)">
    <rect width="410" height="110" fill="white" stroke="#9bc7d8" stroke-width="1"/>
    <text x="20" y="30" font-family="Georgia" font-size="14" letter-spacing="2" fill="#b8860b">MODULE 2.8</text>
    <text x="20" y="60" font-family="Georgia" font-size="20" font-weight="500" fill="#1e4660">Failure, escalation, rollback</text>
    <text x="20" y="85" font-family="Helvetica" font-size="12" fill="#4a5a65">Pause/revert/compensate; customer comms</text>
  </g>
  <g transform="translate(940,1400)">
    <rect width="410" height="110" fill="white" stroke="#9bc7d8" stroke-width="1"/>
    <text x="20" y="30" font-family="Georgia" font-size="14" letter-spacing="2" fill="#b8860b">MODULE 2.9</text>
    <text x="20" y="60" font-family="Georgia" font-size="20" font-weight="500" fill="#1e4660">Capstone agent workflow</text>
    <text x="20" y="85" font-family="Helvetica" font-size="12" fill="#4a5a65">Compose the Agent Operating Plan; defend at panel</text>
  </g>
  <g transform="translate(80,1620)">
    <rect width="1280" height="180" fill="#1e4660"/>
    <text x="40" y="50" font-family="Georgia" font-size="14" letter-spacing="3" fill="#b8860b">PRICING</text>
    <text x="40" y="100" font-family="Georgia" font-size="36" font-weight="500" fill="#fdf8ef">On inquiry</text>
    <text x="40" y="135" font-family="Helvetica" font-size="14" fill="#d4e9f1" opacity="0.85">Tier 2 enrollment is per-seat with team bundles. Apply via the form below for a 15-minute scoping.</text>
    <rect x="1020" y="68" width="220" height="56" rx="3" fill="#b8860b"/>
    <text x="1130" y="104" font-family="Helvetica" font-size="16" font-weight="500" fill="#1e4660" text-anchor="middle">Apply for Tier 2</text>
  </g>

  <!-- Footer -->
  <g transform="translate(0,2060)">
    <rect width="1440" height="140" fill="#1e4660"/>
    <text x="80" y="40" font-family="Georgia" font-size="22" fill="#fdf8ef" font-weight="500">Aegis Academy</text>
    <text x="80" y="100" font-family="Helvetica" font-size="11" fill="#d4e9f1" opacity="0.6">AI-content disclosure: portions of this page were AI-drafted and human-edited.</text>
    <text x="80" y="120" font-family="Helvetica" font-size="11" fill="#d4e9f1" opacity="0.6">Refund policy · Terms · Privacy · Contact</text>
