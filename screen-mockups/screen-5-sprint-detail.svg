    <text x="30" y="40" font-family="Georgia" font-size="14" letter-spacing="2" fill="#b8860b">MIDDAY</text>
    <text x="160" y="40" font-family="Helvetica" font-size="14" fill="#1a2a35">Golden-set + daily-eval design for the top 3 workflows.</text>
  </g>
  <g transform="translate(80,1040)">
    <rect width="1280" height="68" fill="white" stroke="#9bc7d8" stroke-width="1"/>
    <text x="30" y="40" font-family="Georgia" font-size="14" letter-spacing="2" fill="#b8860b">PM</text>
    <text x="160" y="40" font-family="Helvetica" font-size="14" fill="#1a2a35">Kill criteria, cost math, governance posture for your domain.</text>
  </g>
  <g transform="translate(80,1120)">
    <rect width="1280" height="68" fill="white" stroke="#9bc7d8" stroke-width="1"/>
    <text x="30" y="40" font-family="Georgia" font-size="14" letter-spacing="2" fill="#b8860b">CLOSE</text>
    <text x="160" y="40" font-family="Helvetica" font-size="14" fill="#1a2a35">30-day deployment plan with named owner and sponsor per workflow.</text>
  </g>
  <g transform="translate(80,1240)">
    <text x="0" y="0" font-family="Georgia" font-size="22" font-weight="500" fill="#1e4660">What you leave with</text>
    <line x1="0" y1="14" x2="60" y2="14" stroke="#b8860b" stroke-width="2"/>
    <g transform="translate(0,40)" font-family="Helvetica" font-size="15" fill="#1a2a35">
      <text x="0" y="0">· A workflow inventory document tailored to your business.</text>
      <text x="0" y="26">· 3 golden sets (one per top workflow) ready to use.</text>
      <text x="0" y="52">· The daily/weekly/monthly cadence on calendars (yours, not ours).</text>
      <text x="0" y="78">· A 30-day deployment plan with named owner per workflow.</text>
      <text x="0" y="104">· The data-policy block ready to drop into your prompt templates.</text>
    </g>
  </g>

  <!-- Apply CTA -->
  <g transform="translate(80,1500)">
    <rect width="1280" height="200" fill="#1e4660"/>
    <text x="40" y="50" font-family="Georgia" font-size="14" letter-spacing="3" fill="#b8860b">INVESTMENT</text>
    <text x="40" y="100" font-family="Georgia" font-size="36" font-weight="500" fill="#fdf8ef">On inquiry</text>
    <text x="40" y="135" font-family="Helvetica" font-size="14" fill="#d4e9f1" opacity="0.85">Depends on team size and location. Includes pre-reads, 1-day facilitator + materials, 30-day check-in call.</text>
    <text x="40" y="160" font-family="Helvetica" font-size="13" fill="#d4e9f1" opacity="0.7">We respond within 2 business days.</text>
    <rect x="1000" y="68" width="240" height="56" rx="3" fill="#b8860b"/>
    <text x="1120" y="104" font-family="Helvetica" font-size="16" font-weight="500" fill="#1e4660" text-anchor="middle">Apply for this sprint →</text>
  </g>

  <!-- Footer -->
  <g transform="translate(0,2050)">
    <rect width="1440" height="150" fill="#1e4660"/>
    <text x="80" y="40" font-family="Georgia" font-size="22" fill="#fdf8ef" font-weight="500">Aegis Academy</text>
    <text x="80" y="100" font-family="Helvetica" font-size="11" fill="#d4e9f1" opacity="0.6">AI-content disclosure: portions of this page were AI-drafted and human-edited. Pricing decisions are human-authored.</text>
    <text x="80" y="120" font-family="Helvetica" font-size="11" fill="#d4e9f1" opacity="0.6">Refund policy · Terms · Privacy · Contact</text>
  </g>
