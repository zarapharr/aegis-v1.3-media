    <text x="0" y="0" font-family="Georgia" font-size="22" font-weight="500" fill="#1e4660">Who this is for</text>
    <line x1="0" y1="14" x2="60" y2="14" stroke="#b8860b" stroke-width="2"/>
    <g transform="translate(0,40)" font-family="Helvetica" font-size="15" fill="#1a2a35">
      <text x="0" y="0">Leadership teams (CEO + executive team, or department head + direct reports) running 20-200 people.</text>
      <text x="0" y="28">You have people using A.I. You do not have a system. The system is what compounds.</text>
    </g>
  </g>

  <!-- Day's flow -->
  <g transform="translate(80,820)">
    <text x="0" y="0" font-family="Georgia" font-size="22" font-weight="500" fill="#1e4660">The day's flow</text>
    <line x1="0" y1="14" x2="60" y2="14" stroke="#b8860b" stroke-width="2"/>
  </g>
  <g transform="translate(80,880)">
