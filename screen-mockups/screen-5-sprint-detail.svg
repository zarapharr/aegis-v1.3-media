    <text x="990" y="92">Sprints</text>
    <text x="1070" y="92">Credentials</text>
    <text x="1180" y="92">About</text>
  </g>
  <rect x="1260" y="75" width="110" height="34" rx="3" fill="#2c5f7f"/>
  <text x="1315" y="97" font-family="Helvetica" font-size="14" fill="#fdf8ef" text-anchor="middle">Apply</text>


  <text x="80" y="160" font-family="Helvetica" font-size="13" fill="#4a5a65">Sprints / <tspan fill="#2c5f7f">AI Operating System Sprint</tspan></text>

  <!-- Hero -->
  <g transform="translate(80,210)">
    <text x="0" y="0" font-family="Georgia" font-size="14" letter-spacing="3" fill="#b8860b">1-DAY SPRINT · IN PERSON OR REMOTE</text>
    <text x="0" y="60" font-family="Georgia" font-size="56" font-weight="500" fill="#1e4660">AI Operating System</text>
    <text x="0" y="105" font-family="Georgia" font-size="56" font-weight="500" fill="#1e4660">Sprint</text>
    <text x="0" y="160" font-family="Georgia" font-size="24" fill="#2c5f7f" font-style="italic">Build the inventory + cadence that scales your team's A.I. use.</text>
  </g>

  <!-- Outcome block -->
  <g transform="translate(80,440)">
    <rect width="1280" height="170" fill="white" stroke="#2c5f7f" stroke-width="2"/>
    <rect width="6" height="170" fill="#b8860b"/>
    <text x="40" y="40" font-family="Georgia" font-size="20" font-weight="500" fill="#1e4660">Outcome you leave with</text>
    <g transform="translate(40,55)" font-family="Helvetica" font-size="14" fill="#4a5a65">
      <text x="0" y="20">Your team leaves the day with a named workflow inventory, the daily/weekly/monthly cadence on calendars,</text>
